<!DOCTYPE html>
<!--
  ARCHIVO: setup.html
  VERSIÓN: v0.3
  FECHA: 01/08/2026
  PROYECTO: CompraZona — Inicialización del tenant (solo super admin) | RavenTechs
  CHANGELOG:
  - v0.3 (01/08/2026): Login con POPUP (no redirect) — setup es de uso único desde
    la compu; popup es más confiable en desktop. Fix de loop de redirect. Título y
    textos actualizados a CompraZona.
  - v0.2 (01/08/2026): Nombre CompraZona.
  - v0.1 (01/08/2026): Creación inicial con seed Firestore.
-->
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Setup — CompraZona</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="estilos.css">
<style>
.paso{background:var(--c-tarjeta);border:1.5px solid var(--c-borde);border-radius:var(--radio);padding:16px;margin-bottom:12px;font-size:14.5px}
.paso b{display:block;margin-bottom:4px}
#log{font-family:ui-monospace,monospace;font-size:12.5px;background:#26221D;color:#C9F5D2;
     border-radius:12px;padding:14px;white-space:pre-wrap;display:none;margin-top:14px;line-height:1.7}
</style>
<script id="rt-login-v1">
/* RavenTechs · Login v1 — (A) «Continuar con Google» arriba y email como segunda opción; (B) recuerda la cuenta Google para no volver a elegirla (login_hint). No toca datos. */
(function(){
  function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v);}catch(e){return null;}}
  /* B — recordar la cuenta Google: se lee del usuario que Firebase ya guardó en el teléfono */
  function capturar(){
    try{
      if(!indexedDB||!indexedDB.databases)return;
      indexedDB.databases().then(function(l){
        if(!l.some(function(d){return d.name==='firebaseLocalStorageDb';}))return;
        var r=indexedDB.open('firebaseLocalStorageDb');
        r.onsuccess=function(){var db=r.result;try{
          if(!db.objectStoreNames.contains('firebaseLocalStorage')){db.close();return;}
          var q=db.transaction('firebaseLocalStorage','readonly').objectStore('firebaseLocalStorage').getAll();
          q.onsuccess=function(){var adm=false;(q.result||[]).forEach(function(it){var u=it&&it.value;
            if(u&&u.email&&!u.isAnonymous&&(u.providerData||[]).some(function(p){return p.providerId==='google.com';}))ls('rt_google_email',u.email);
            if(u&&u.email&&String(u.email).toLowerCase()==='rgaraventa@gmail.com'&&u.emailVerified===true)adm=true;});
            try{if(adm)localStorage.setItem('rt_admin','1');else localStorage.removeItem('rt_admin');}catch(e){}
            db.close();};
        }catch(e){try{db.close();}catch(x){}}};
      }).catch(function(){});
    }catch(e){}
  }
  capturar();setInterval(capturar,8000);document.addEventListener('visibilitychange',capturar);
  window.addEventListener('focus',capturar);
  /* Puerta del panel interno: solo la cuenta admin (la seguridad real la dan las reglas de Firestore) */
  window.rtIsAdmin=function(){capturar();return ls('rt_admin')==='1';};
  window.rtHasHint=function(){return !!ls('rt_google_email');};
  window.rtProv=function(p){var e=ls('rt_google_email');try{if(e&&p&&p.setCustomParameters)p.setCustomParameters({login_hint:e});}catch(x){}return p;};
  /* A — Google primero */
  var OR=/^(o|ó|or|—|-|–|o ingresá con|o ingresa con)$/i;
  function visible(e){return !!(e&&(e.offsetWidth||e.offsetHeight||e.getClientRects().length));}
  function ordenar(){
    var bs=[].slice.call(document.querySelectorAll('button'));
    bs.forEach(function(g){
      if(g.getAttribute('data-rt-login'))return;
      var tx=(g.textContent||'').trim();
      var esG=/google/i.test(g.id||'')||/google/i.test(typeof g.className==='string'?g.className:'')||(/google/i.test(tx)&&tx.length<60);
      if(!esG)return;
      var a=g.parentElement,F=null;
      while(a&&a!==document.body){
        var inp=a.querySelector('input[type=email],input[type=password],input[type=text],input:not([type])');
        if(inp&&!g.contains(inp)){
          var c=a.firstElementChild;F=null;
          while(c){if(c.contains(inp)){F=c;break;}c=c.nextElementSibling;}
          var G=g;while(G&&G.parentElement!==a)G=G.parentElement;
          if(F&&G&&F!==G&&(F.compareDocumentPosition(G)&Node.DOCUMENT_POSITION_FOLLOWING)){
            g.setAttribute('data-rt-login','1');
            var prev=G.previousElementSibling;
            if(prev&&prev!==F&&OR.test((prev.textContent||'').trim())&&!prev.querySelector('input,button'))prev.style.display='none';
            G.style.marginBottom='10px';G.style.width='100%';
            a.insertBefore(G,F);
            var d=document.createElement('div');d.className='rt-or';
            d.style.cssText='display:flex;align-items:center;gap:8px;margin:6px 0 12px;font-size:12px;opacity:.7;text-align:center';
            d.innerHTML='<span style="flex:1;height:1px;background:currentColor;opacity:.35"></span>o con tu email<span style="flex:1;height:1px;background:currentColor;opacity:.35"></span>';
            a.insertBefore(d,F);
            return;
          }
          if(F)return;
        }
        a=a.parentElement;
      }
    });
  }
  function iniciar(){ordenar();try{var mo=new MutationObserver(function(){ordenar();});mo.observe(document.documentElement,{childList:true,subtree:true});setTimeout(function(){mo.disconnect();},20000);}catch(e){}}
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',iniciar);else iniciar();
})();
</script>
</head>
<body>
<div class="pantalla-acceso" id="contenido">
  <span class="ico">⚙️</span>
  <h2>Inicialización de CompraZona</h2>
  <p>Crea el tenant <b>garrafas-agua</b> en Firestore con los datos semilla
     (categorías, empresas demo y productos).<br>
     Solo el super administrador puede ejecutarlo.</p>
  <button class="btn-principal" id="btnAccion">Ingresar con Google</button>
  <div id="log"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="core.js"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var usuario = null;
  var app, auth, db;

  function log(txt) {
    var el = $('log');
    el.style.display = 'block';
    el.textContent += txt + '\n';
    el.scrollTop = el.scrollHeight;
  }

  // Inicializar Firebase directamente (popup, sin pasar por RM.login)
  try {
    app  = firebase.initializeApp(RM_CONFIG.FIREBASE);
    auth = firebase.auth();
    db   = firebase.firestore();
  } catch (e) {
    log('Error inicializando Firebase: ' + e.message);
  }

  auth.onAuthStateChanged(function (u) {
    usuario = u;
    if (!u) {
      $('btnAccion').textContent = 'Ingresar con Google';
      $('btnAccion').disabled = false;
      return;
    }
    if (u.email !== RM_CONFIG.SUPER_ADMIN) {
      $('btnAccion').style.display = 'none';
      log('⛔  La cuenta ' + u.email + ' no tiene permisos.');
      return;
    }
    $('btnAccion').textContent = '🚀 Crear datos iniciales del tenant';
    $('btnAccion').disabled = false;
  });

  $('btnAccion').addEventListener('click', function () {
    // Paso 1: login con POPUP (esta página es solo de compu)
    if (!usuario) {
      $('btnAccion').disabled = true;
      $('btnAccion').textContent = 'Abriendo Google…';
      var provider = (window.rtProv||function(p){return p})(new firebase.auth.GoogleAuthProvider());
      auth.signInWithPopup(provider)
        .then(function (res) { usuario = res.user; })
        .catch(function (e) {
          log('Error de login: ' + e.message);
          $('btnAccion').textContent = 'Ingresar con Google';
          $('btnAccion').disabled = false;
        });
      return;
    }

    // Paso 2: seed
    if (usuario.email !== RM_CONFIG.SUPER_ADMIN) return;
    $('btnAccion').disabled = true;
    log('Iniciando seed del tenant "' + RM_DEMO.tenant.slug + '"…');

    var batch = db.batch();
    var tRef = db.collection('tenants').doc(RM_DEMO.tenant.slug);

    batch.set(tRef, RM_DEMO.tenant);

    RM_DEMO.categorias.forEach(function (c) {
      batch.set(tRef.collection('categorias').doc(c.id),
        { nombre: c.nombre, icono: c.icono, orden: c.orden, activa: c.activa, sinonimos: c.sinonimos });
    });

    RM_DEMO.empresas.forEach(function (e) {
      var data = {
        nombre: e.nombre, categorias: e.categorias, whatsapp: e.whatsapp,
        direccion: e.direccion, geo: e.geo, tiempoEstimadoMin: e.tiempoEstimadoMin,
        ratingProm: e.ratingProm, ratingCant: e.ratingCant,
        destacada: e.destacada, activa: e.activa, horario: e.horario
      };
      batch.set(tRef.collection('empresas').doc(e.id), data);
      (RM_DEMO.productos[e.id] || []).forEach(function (p) {
        batch.set(
          tRef.collection('empresas').doc(e.id).collection('productos').doc(p.id),
          { nombre: p.nombre, precio: p.precio, categoria: p.categoria, activo: p.activo }
        );
      });
    });

    batch.commit()
      .then(function () {
        log('✅  ' + RM_DEMO.categorias.length + ' categorías creadas.');
        log('✅  ' + RM_DEMO.empresas.length + ' empresas con sus productos.');
        log('');
        log('¡Listo! Ahora podés abrir la app cliente y el panel empresa.');
        log('Este botón queda bloqueado — el seed ya está en Firestore.');
        $('btnAccion').textContent = '✅ Seed completado';
        RM.limpiarCache();
      })
      .catch(function (e) {
        log('❌  Error: ' + (e.message || e));
        log('Verificá que las reglas de Firestore estén publicadas.');
        $('btnAccion').disabled = false;
        $('btnAccion').textContent = 'Reintentar seed';
      });
  });
})();
</script>
</body>
</html>
